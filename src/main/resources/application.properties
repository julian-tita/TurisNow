# Application Configuration
spring.application.name=TurisNow
server.port=9090

# Database Configuration - Supabase PostgreSQL
spring.datasource.url=jdbc:postgresql://db.efnwzwxcsafmtxrafggw.supabase.co:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=7MsD1C-9
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Configuration for Supabase
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# JPA Configuration
# Validate schema (production mode - change to 'update' if you need to modify schema)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect # Auto-detected by Hibernate
spring.jpa.properties.hibernate.format_sql=true

# Security Configuration
jwt.secret=mySecretKey123456789012345678901234567890
jwt.expiration=86400000

# Logging
logging.level.app.TurisNow=DEBUG
logging.level.org.springframework.jdbc.datasource=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
